<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표현 놀이터</title>
<style>
  :root{
    --bg:#F5F3EE;
    --surface:#FFFFFF;
    --ink:#2B2A28;
    --ink-muted:#7A756C;
    --line:#E4DFD3;
    --accent:#E2901F;
    --a:#C85A2E;
    --b:#2E6B9E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:720px;margin:0 auto;padding:56px 20px 60px;}
  h1{font-size:1.9rem;margin:0 0 8px;}
  p.lead{color:var(--ink-muted);margin:0 0 36px;font-size:1.02rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  a.card{
    display:block;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 22px 20px;
    text-decoration:none;
    color:inherit;
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 20px rgba(0,0,0,.05);
    transition:transform .15s ease;
  }
  a.card:hover{transform:translateY(-3px);}
  .emoji{font-size:2.2rem;display:block;margin-bottom:10px;}
  .card h2{font-size:1.15rem;margin:0 0 6px;}
  .card p{font-size:.92rem;color:var(--ink-muted);margin:0;}
  .tag{
    display:inline-block;margin-top:12px;font-size:.78rem;font-weight:600;
    padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink-muted);
  }
  footer{margin-top:48px;font-size:.82rem;color:var(--ink-muted);}
</style>
</head>
<body>
  <div class="wrap">
    <h1>표현 놀이터</h1>
    <p class="lead">아이가 감정과 마음을 표현하는 법을 배우는 작은 게임 모음이에요.</p>
    <div class="grid">
      <a class="card" href="emotion/">
        <span class="emoji">😊</span>
        <h2>표정 맞추기</h2>
        <p>사진 속 표정을 보고 어떤 감정인지 맞혀보는 게임이에요.</p>
        <span class="tag">감정 인식</span>
      </a>
      <a class="card" href="cause-and-result/">
        <span class="emoji">🧩</span>
        <h2>왜 그랬을까?</h2>
        <p>친구 사이에 있었던 일을 두 마음으로 다시 보며 원인과 결과를 배워요.</p>
        <span class="tag">원인과 결과</span>
      </a>
    </div>
    <footer>hm expression · 더 많은 표현 놀이가 이곳에 계속 추가될 예정이에요.</footer>
  </div>
</body>
</html>
