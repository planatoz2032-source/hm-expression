<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표정 맞추기 게임</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <button class="icon-btn" id="btn-home" title="홈으로" aria-label="홈으로">🏠</button>
    <h1 class="app-title">표정 맞추기</h1>
    <nav class="header-nav">
      <button class="nav-link" id="btn-dictionary">감정도감</button>
      <button class="nav-link" id="btn-wrongnote">오답노트</button>
      <button class="icon-btn" id="btn-settings" title="설정" aria-label="설정">⚙️</button>
    </nav>
  </header>

  <main id="app"></main>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settings-modal" hidden>
    <div class="modal-box">
      <h2>설정</h2>
      <p class="modal-desc">다른 친구 차례! 기록 지우기</p>
      <button class="btn btn-warning" id="btn-open-reset-confirm">기록 초기화하기</button>
      <div class="confirm-row" id="reset-confirm-row" hidden>
        <p>정말 모든 기록을 지울까요?<br><small>(오답노트와 진행 기록이 모두 사라져요)</small></p>
        <div class="confirm-buttons">
          <button class="btn btn-big btn-yes" id="btn-reset-yes">네</button>
          <button class="btn btn-big btn-no" id="btn-reset-no">아니요</button>
        </div>
      </div>
      <button class="btn btn-plain" id="btn-close-settings">닫기</button>
    </div>
  </div>

  <div id="confetti-layer" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
