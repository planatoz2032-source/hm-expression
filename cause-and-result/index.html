<title>왜 그랬을까 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6EFE1;
  --surface:#FFFFFF;
  --surface-2:#EFE3C8;
  --ink:#2E2419;
  --ink-muted:#8C7C61;
  --line:#E6D8B8;
  --accent:#E2901F;
  --accent-soft:#FBEAC9;
  --a:#C85A2E;
  --a-soft:#F5DCC9;
  --b:#2E6B9E;
  --b-soft:#DCEAF5;
  --good:#3C8A5D;
  --good-soft:#E1F0E5;
  --shadow: 0 1px 2px rgba(46,36,25,.08), 0 10px 24px rgba(46,36,25,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E170E;
    --surface:#2A2115;
    --surface-2:#352A19;
    --ink:#F2E8D4;
    --ink-muted:#B6A47D;
    --line:#493A24;
    --accent:#F0A93E;
    --accent-soft:#3A2C16;
    --a:#E68A56;
    --a-soft:#3B2A1F;
    --b:#7FB3E3;
    --b-soft:#20303F;
    --good:#7FCB9C;
    --good-soft:#213328;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1E170E;
  --surface:#2A2115;
  --surface-2:#352A19;
  --ink:#F2E8D4;
  --ink-muted:#B6A47D;
  --line:#493A24;
  --accent:#F0A93E;
  --accent-soft:#3A2C16;
  --a:#E68A56;
  --a-soft:#3B2A1F;
  --b:#7FB3E3;
  --b-soft:#20303F;
  --good:#7FCB9C;
  --good-soft:#213328;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.6;
  word-break:keep-all;
  padding:0 16px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

.wrap{max-width:640px;margin:0 auto;padding-block:28px 60px;}

header.top{margin-bottom:18px;}
.eyebrow{
  font-size:.76rem;
  letter-spacing:.06em;
  color:var(--ink-muted);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;
  margin-bottom:10px;
}
.eyebrow a{color:var(--accent);text-decoration:none;font-weight:500;}
.eyebrow a:hover{text-decoration:underline;}
h1{
  font-family:"Jua",sans-serif;
  font-weight:400;
  font-size:clamp(1.5rem,5vw,2.1rem);
  text-wrap:balance;
  margin:0 0 4px;
}
.sub{color:var(--ink-muted);font-size:.92rem;margin:0;}

/* situation nav — scales to 35 without wrapping into a wall of chips */
.sit-nav{display:flex;align-items:stretch;gap:8px;margin:18px 0 14px;}
.icon-btn{
  flex:0 0 auto;
  width:40px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-muted);
  font-size:1rem;
  cursor:pointer;
}
.icon-btn:hover{color:var(--ink);background:var(--accent-soft);}
.sit-current{
  flex:1 1 auto;
  min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:6px 10px;
  cursor:pointer;
  font-family:inherit;
}
.sit-current:hover{background:var(--accent-soft);}
.sit-count{font-size:.72rem;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
.sit-count strong{color:var(--ink);}
.sit-title{
  font-size:.92rem;font-weight:700;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}

/* 전체 목록 모달 */
.sit-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
.sit-modal-backdrop{position:absolute;inset:0;background:rgba(20,15,5,.45);}
.sit-modal-panel{
  position:relative;
  background:var(--surface);
  border-radius:18px;
  width:100%;max-width:420px;
  max-height:78vh;
  overflow-y:auto;
  padding:16px 18px 20px;
  box-shadow:var(--shadow);
}
.sit-modal-head{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.84rem;color:var(--ink-muted);margin-bottom:12px;
}
.sit-modal-head .icon-btn{width:32px;}
.sit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;}
.sit-tile{
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-muted);
  font-weight:700;
  font-size:.92rem;
  cursor:pointer;
  font-family:"Noto Sans KR",sans-serif;
}
.sit-tile:hover{background:var(--accent-soft);}
.sit-tile.done{background:var(--good-soft);color:var(--good);border-color:transparent;}
.sit-tile.active{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft);color:var(--ink);}

/* progress dots */
.progress{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}
.progress .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--line);
  transition:transform .15s ease, background .15s ease;
}
.progress .dot.done{background:var(--ink-muted);}
.progress .dot.cur{transform:scale(1.5);background:var(--accent);}
.progress .dot.a{background:var(--a-soft);}
.progress .dot.a.done, .progress .dot.a.cur{background:var(--a);}
.progress .dot.b{background:var(--b-soft);}
.progress .dot.b.done, .progress .dot.b.cur{background:var(--b);}

/* stage card */
.stage{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:18px 18px 22px;
}
.scene-frame{
  background:var(--surface-2);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:16px;
}
.scene-frame svg{display:block;width:100%;height:auto;}
.fig-label{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:15px;fill:var(--ink);}

/* intro caption — moved above the illustration, enlarged */
.intro-caption{text-align:center;margin-bottom:14px;}
.intro-caption .tag{
  font-size:.82rem;
  color:var(--ink-muted);
  margin:0 0 6px;
}
.intro-caption .big{
  font-family:"Jua",sans-serif;
  font-weight:400;
  font-size:clamp(1.3rem,4.5vw,1.6rem);
  line-height:1.45;
  text-wrap:balance;
  margin:0;
}

.question{
  font-family:"Jua",sans-serif;
  font-weight:400;
  font-size:1.25rem;
  text-align:center;
  margin:4px 0 14px;
  text-wrap:balance;
}

.examples{
  margin-top:14px;
  background:var(--accent-soft);
  border-radius:14px;
  padding:14px 16px;
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.examples-label{font-size:.8rem;color:var(--ink-muted);margin-bottom:8px;}
.reasons{display:flex;flex-wrap:wrap;gap:8px;}
.reasons .chip{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 13px;
  font-size:.88rem;
}
.note{font-size:.84rem;color:var(--ink-muted);margin-top:12px;}

/* parent-facing badge — whose perspective this card shows */
.badges{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px;}
.badge{
  font-size:1rem;
  font-weight:700;
  padding:9px 20px;
  border-radius:999px;
  background:var(--surface-2);
  color:var(--ink-muted);
  border:1px solid var(--line);
}
.badge.a{background:var(--a-soft);color:var(--a);border-color:transparent;}
.badge.b{background:var(--b-soft);color:var(--b);border-color:transparent;}

/* reset progress */
.reset-link{
  display:block;
  margin-top:10px;
  background:none;
  border:none;
  padding:0;
  color:var(--ink-muted);
  font-size:.8rem;
  text-decoration:underline;
  cursor:pointer;
  font-family:inherit;
}
.reset-link:hover{color:var(--ink);}

/* flip reveal card (feel / result) */
.flipcard{
  border:1px dashed var(--line);
  border-radius:16px;
  padding:22px 18px;
  text-align:center;
  cursor:pointer;
  background:var(--bg);
  transition:transform .12s ease;
}
.flipcard:hover{transform:translateY(-2px);}
.flipcard .tap-label{color:var(--ink-muted);font-size:.92rem;}
.reveal{
  border-radius:16px;
  padding:20px 18px;
  text-align:center;
  animation:pop .28s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
.reveal.a{background:var(--a-soft);}
.reveal.b{background:var(--b-soft);}
.reveal .icon{font-size:2.4rem;display:block;margin-bottom:6px;}
.reveal .label{font-family:"Jua",sans-serif;font-size:1.15rem;}
.reveal .text{font-size:1rem;margin-top:8px;}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
.btn{
  font-family:"Noto Sans KR",sans-serif;
  font-weight:700;
  font-size:.96rem;
  border:none;
  border-radius:999px;
  padding:11px 20px;
  cursor:pointer;
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
.btn:active{transform:translateY(0);filter:brightness(.97);}
.btn.primary{background:var(--accent);color:#fff;margin-left:auto;}
.btn.ghost{background:transparent;color:var(--ink-muted);border:1px solid var(--line);}
.btn:disabled{opacity:.4;cursor:default;transform:none;}

footer{
  max-width:640px;margin:30px auto 0;
  color:var(--ink-muted);font-size:.8rem;
  border-top:1px solid var(--line);padding-top:16px;
}
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">
      <span>전체 35개 상황</span>
      <a href="https://claude.ai/code/artifact/0e3e19fe-8b54-4943-853e-5df26bb146d4" target="_blank" rel="noopener">📋 기획서 보기</a>
    </div>
    <h1>왜 그랬을까?</h1>
    <p class="sub">그림을 보고, A와 B의 마음을 하나씩 따라가 봐요.</p>
  </header>

  <div class="sit-nav">
    <button class="icon-btn" id="prevSitBtn" type="button" aria-label="이전 상황">◀</button>
    <button class="sit-current" id="allSitBtn" type="button">
      <span class="sit-count">상황 <strong id="sitIndexLabel">1</strong> / <span id="sitTotalLabel">3</span></span>
      <span class="sit-title" id="sitTitleLabel">① 장난감</span>
    </button>
    <button class="icon-btn" id="nextSitBtn" type="button" aria-label="다음 상황">▶</button>
  </div>
  <div class="progress" id="progress"></div>

  <div class="sit-modal" id="sitModal" hidden>
    <div class="sit-modal-backdrop" id="sitModalBackdrop"></div>
    <div class="sit-modal-panel">
      <div class="sit-modal-head">
        <span id="modalProgressLabel">전체 상황</span>
        <button class="icon-btn" id="closeModalBtn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="sit-grid" id="sitGrid"></div>
    </div>
  </div>

  <div class="stage">
    <div class="intro-caption" id="introCaption" hidden></div>
    <div class="scene-frame" id="sceneFrame"></div>
    <div id="questionBox"></div>
    <div id="interact"></div>
    <div class="nav">
      <button class="btn ghost" id="backBtn">← 이전</button>
      <button class="btn primary" id="primaryBtn"></button>
    </div>
    <div class="badges" id="badges"></div>
  </div>

  <footer>
    왜 그랬을까 · 원인과 결과 놀이터 — 상황 35개 전체. 상황이 바뀌거나 단계가 바뀔 때 서로 다른 소리가 납니다.
    <button id="resetBtn" class="reset-link" type="button">진행 상황 초기화</button>
  </footer>
</div>

        result:"하윤이와 이야기해서 둘 다 아는 규칙으로 정했어요.",
        exampleReasons:["다른 규칙을 배워서","이 방법이 더 맞다고 생각해서","헷갈려서 다르게 말했어요"] },
    resolutionExamples:["시작 전에 규칙을 같이 정해요","다르면 이야기해서 맞춰봐요","둘 다 동의하는 규칙으로 해요"]
  },
  {
    id:35, tabLabel:"㉟ 거절한 호의", scene:"generic", emoji:"🤝",
    narration:"서아가 채원이에게 “내가 이거 빌려줄게”라고 했어요. 채원이가 “괜찮아”라며 거절했어요.",
    a:{ name:"서아", trigger:"채원이에게 도움이 되고 싶어서 먼저 빌려주겠다고 했어요",
        emotion:{label:"머쓱함", icon:"😅", mood:"worried"},
        result:"거절당해 머쓱했지만, 채원이의 선택을 존중하기로 했어요.",
        exampleReasons:["도움이 되고 싶어서","친절을 베풀고 싶어서","필요할 것 같아서 물어봤어요"] },
    b:{ name:"채원", trigger:"지금은 빌리지 않아도 괜찮은 상황이었어요",
        emotion:{label:"편안함", icon:"🙂", mood:"neutral"},
        result:"고맙다고 말하고 정중하게 거절했어요.",
        exampleReasons:["지금은 필요 없어서","혼자 해보고 싶어서","이미 가지고 있어서"] },
    resolutionExamples:["호의를 거절당해도 서운해하지 않아요","“고마워”라는 말만으로도 충분해요","다음에 필요할 때 다시 물어봐도 돼요"]
  }
];

const STEPS = [
  {key:"intro",     q:null},
  {key:"ask-a",     q:"A는 왜 그랬을까?"},
  {key:"feel-a",    q:"A는 어떤 기분일까?"},
  {key:"result-a",  q:"그래서 A에게 무슨 일이 생겼을까?"},
  {key:"ask-b",     q:"B는 왜 그랬을까?"},
  {key:"feel-b",    q:"B는 어떤 기분일까?"},
  {key:"result-b",  q:"그래서 B에게 무슨 일이 생겼을까?"},
  {key:"resolve",   q:"다음엔 어떻게 하면 좋을까?"}
];

/* ---------- audio ---------- */
const sfxSituation = new Audio("sfx-situation.mp3");
const sfxStep = new Audio("sfx-step.mp3");
function playSfx(a){ try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){} }

/* ---------- scene illustrations ---------- */
const SKIN = "#F4C9A0";
const HAIR = "#5B4030";
const INK  = "#2E2419";

function faceParts(mood){
  const M = {
    neutral:  {mouth:'<path d="M-9,8 L9,8" stroke-linecap="round"/>', brow:""},
    excited:  {mouth:'<path d="M-11,4 Q0,18 11,4" stroke-linecap="round"/>', brow:""},
    sad:      {mouth:'<path d="M-10,12 Q0,3 10,12" stroke-linecap="round"/>', brow:""},
    surprised:{mouth:'<ellipse cx="0" cy="9" rx="5" ry="6"/>', brow:'<path d="M-14,-16 L-5,-16 M14,-16 L5,-16" stroke-linecap="round"/>'},
    worried:  {mouth:'<path d="M-9,10 Q0,6 9,10" stroke-linecap="round"/>', brow:'<path d="M-14,-14 L-4,-11 M14,-14 L4,-11" stroke-linecap="round"/>'},
    angry:    {mouth:'<path d="M-10,11 Q0,4 10,11" stroke-linecap="round"/>', brow:'<path d="M-14,-13 L-3,-8 M14,-13 L3,-8" stroke-linecap="round"/>'}
  };
  const m = M[mood] || M.neutral;
  return `<g fill="none" stroke="${INK}" stroke-width="2.4">${m.brow}</g>
          <circle cx="-13" cy="9" r="5" fill="#F0A98F" opacity=".55"/>
          <circle cx="13" cy="9" r="5" fill="#F0A98F" opacity=".55"/>
          <circle cx="-9" cy="-4" r="2.6" fill="${INK}"/>
          <circle cx="9" cy="-4" r="2.6" fill="${INK}"/>
          <g fill="none" stroke="${INK}" stroke-width="2.4">${m.mouth}</g>`;
}
/* side: -1(left figure, arm reaches to the right) or 1(right figure, arm reaches to the left). angle in degrees, 0 = arm down at rest */
function arm(side, angle, color){
  const x = side * 27;
  const originX = side * 30;
  return `<rect x="${x - 7}" y="150" width="14" height="36" rx="7" fill="${color}"
    transform="rotate(${side * angle} ${originX} 152)"/>`;
}
function figure(cx, color, mood, label, focused, armL, armR){
  return `
  <g transform="translate(${cx},0)">
    <ellipse cx="0" cy="207" rx="38" ry="9" fill="rgba(0,0,0,.14)"/>
    <circle cx="0" cy="148" r="64" fill="none" stroke="var(--accent)" stroke-width="5" opacity="${focused ? 1 : 0}"/>
    <rect x="-19" y="193" width="15" height="20" rx="6" fill="${HAIR}" opacity=".85"/>
    <rect x="4" y="193" width="15" height="20" rx="6" fill="${HAIR}" opacity=".85"/>
    ${armL}
    ${armR}
    <rect x="-27" y="140" width="54" height="58" rx="23" fill="${color}"/>
    <path d="M-27,158 Q0,148 27,158 L27,168 Q0,158 -27,168 Z" fill="rgba(255,255,255,.25)"/>
    <g transform="translate(0,110)">
      <circle cx="0" cy="0" r="30" fill="${SKIN}"/>
      <path d="M-29,-4 A29,29 0 0 1 29,-4 L27,-15 A29,24 0 0 0 -27,-15 Z" fill="${HAIR}"/>
      ${faceParts(mood)}
    </g>
    <text x="0" y="240" text-anchor="middle" class="fig-label">${label}</text>
  </g>`;
}
function sceneBase(kind){
  const skyId = "sky-" + kind;
  return `<defs>
      <linearGradient id="${skyId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent-soft)"/>
        <stop offset="1" stop-color="var(--surface-2)"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="480" height="260" fill="url(#${skyId})"/>
    <circle cx="422" cy="42" r="24" fill="var(--surface)" opacity=".7"/>
    <rect x="0" y="214" width="480" height="46" fill="var(--good-soft)"/>
    <rect x="0" y="212" width="480" height="4" fill="var(--good)" opacity=".55"/>
    <g stroke="var(--good)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55">
      <path d="M34,214 q3,-11 6,0 M42,214 q3,-11 6,0 M50,214 q3,-11 6,0"/>
      <path d="M400,214 q3,-11 6,0 M408,214 q3,-11 6,0 M416,214 q3,-11 6,0"/>
    </g>`;
}
function sceneSVG(kind, situation, focus){
  const moodA = focus==="a" ? situation.a.emotion.mood : "neutral";
  const moodB = focus==="b" ? situation.b.emotion.mood : "neutral";
  let armA = ["", ""], armB = ["", ""], prop = "";

  if(kind === "toy"){
    armA = [arm(-1, 10, "var(--a)"), arm(1, -55, "var(--a)")];   /* A reaches toward the toy */
    armB = [arm(-1, 15, "var(--b)"), arm(1, 15, "var(--b)")];
    prop = `
      <g transform="translate(240,192)">
        <rect x="-24" y="-16" width="48" height="18" rx="7" fill="var(--good)"/>
        <rect x="-15" y="-27" width="26" height="13" rx="4" fill="var(--good)"/>
        <rect x="-10" y="-24" width="8" height="8" rx="2" fill="#fff" opacity=".8"/>
        <rect x="4" y="-24" width="8" height="8" rx="2" fill="#fff" opacity=".8"/>
        <circle cx="-13" cy="4" r="8" fill="${INK}"/><circle cx="-13" cy="4" r="3" fill="#fff" opacity=".6"/>
        <circle cx="13" cy="4" r="8" fill="${INK}"/><circle cx="13" cy="4" r="3" fill="#fff" opacity=".6"/>
        <path d="M-44,-18 L-28,-12 M-44,-6 L-26,-4" stroke="var(--ink-muted)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      </g>`;
  } else if(kind === "ball"){
    armA = [arm(-1, 15, "var(--a)"), arm(1, -95, "var(--a)")];   /* A just threw, arm up */
    armB = [arm(-1, 15, "var(--b)"), arm(1, 15, "var(--b)")];
    prop = `
      <path d="M172,150 Q240,55 302,148" fill="none" stroke="var(--ink-muted)" stroke-width="2.5" stroke-dasharray="6 8" opacity=".6"/>
      <g transform="translate(298,148)">
        <circle r="16" fill="#fff" stroke="var(--a)" stroke-width="3"/>
        <path d="M-11,-4 Q0,5 11,-4 M-9,8 Q0,3 9,8" stroke="var(--a)" stroke-width="2" fill="none"/>
      </g>
      <g stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" opacity=".7">
        <path d="M328,118 L340,106 M334,132 L349,128 M326,144 L338,150"/>
      </g>`;
  } else if(kind === "push"){
    armA = [arm(-1, 20, "var(--a)"), arm(1, -35, "var(--a)")];   /* A pushes forward */
    armB = [arm(-1, 0, "var(--b)"), arm(1, 40, "var(--b)")];      /* B off-balance */
    prop = `
      <g opacity=".9">
        <rect x="146" y="198" width="36" height="11" rx="5" fill="var(--surface)" stroke="var(--line)"/>
        <text x="164" y="207" text-anchor="middle" font-size="9" fill="var(--ink-muted)" font-family="Noto Sans KR, sans-serif">3</text>
        <rect x="186" y="198" width="36" height="11" rx="5" fill="var(--surface)" stroke="var(--line)"/>
        <text x="204" y="207" text-anchor="middle" font-size="9" fill="var(--ink-muted)" font-family="Noto Sans KR, sans-serif">2</text>
        <rect x="226" y="198" width="36" height="11" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="244" y="207" text-anchor="middle" font-size="9" fill="var(--accent)" font-family="Noto Sans KR, sans-serif" font-weight="700">1</text>
      </g>
      <path d="M92,150 L118,150" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
      <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"/></marker></defs>`;
  } else {
    /* generic scene — covers most of the 35 situations with one big icon instead of bespoke props */
    armA = [arm(-1, 12, "var(--a)"), arm(1, 12, "var(--a)")];
    armB = [arm(-1, 12, "var(--b)"), arm(1, 12, "var(--b)")];
    prop = `<text x="240" y="160" font-size="58" text-anchor="middle" dominant-baseline="middle">${situation.emoji || "❓"}</text>`;
  }

  const figA = figure(140, "var(--a)", moodA, situation.a.name, focus==="a", armA[0], armA[1]);
  const figB = figure(340, "var(--b)", moodB, situation.b.name, focus==="b", armB[0], armB[1]);

  return `<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg">
    ${sceneBase(kind)}
    ${prop}
    ${figB}
    ${figA}
  </svg>`;
}

/* ---------- state ---------- */
let state = { sit:0, step:0, revealed:false };

function chip(text){ return `<span class="chip">${text}</span>`; }

/* ---------- progress (per-viewer, resumes at the next unplayed situation) ---------- */
const PROGRESS_KEY = "whyDidThat.completedCount";
function getProgress(){
  try{ return parseInt(localStorage.getItem(PROGRESS_KEY), 10) || 0; }catch(e){ return 0; }
}
function saveProgress(n){
  try{ localStorage.setItem(PROGRESS_KEY, String(n)); }catch(e){}
}

/* ---------- badge — tell a parent whose perspective this card shows ---------- */
function badgesFor(step, sit){
  if(step.key.endsWith("-a")) return `<span class="badge a">👤 ${sit.a.name}의 관점</span>`;
  if(step.key.endsWith("-b")) return `<span class="badge b">👤 ${sit.b.name}의 관점</span>`;
  return "";
}

/* 이름 받침 유무에 따라 "이가/가"를 붙인다 (하람 → 하람이가, 소이 → 소이가) */
function hasBatchim(name){
  const code = name.charCodeAt(name.length - 1) - 0xAC00;
  if(code < 0 || code > 11171) return false;
  return code % 28 !== 0;
}
function withSubject(name){ return hasBatchim(name) ? `${name}이가` : `${name}가`; }

function questionText(step, sit){
  if(step.key === "ask-a") return `${withSubject(sit.a.name)} 왜 그랬는지 말해 보세요.`;
  if(step.key === "ask-b") return `${withSubject(sit.b.name)} 왜 그랬는지 말해 보세요.`;
  if(step.key === "resolve") return "다음엔 어떻게 하면 좋을지 말해 보세요.";
  return step.q.replace("A", sit.a.name).replace("B", sit.b.name);
}

function primaryLabel(step, isLastStepOfLastSit){
  if(!state.revealed) return "얘기했어요, 확인!";
  if(isLastStepOfLastSit) return "처음부터 다시 보기";
  if(step.key === "resolve") return "다음 상황 ▶";
  return "다음 단계로 →";
}

function render(){
  const sit = situations[state.sit];
  const step = STEPS[state.step];
  const focus = step.key.endsWith("-a") ? "a" : step.key.endsWith("-b") ? "b" : null;

  /* situation nav */
  const total = situations.length;
  document.getElementById("sitIndexLabel").textContent = state.sit + 1;
  document.getElementById("sitTotalLabel").textContent = total;
  document.getElementById("sitTitleLabel").textContent = sit.tabLabel;
  document.getElementById("sitTitleLabel").title = sit.tabLabel;

  /* 전체 목록 모달이 열려 있으면 내용도 같이 갱신 */
  if(!document.getElementById("sitModal").hidden) renderSitGrid();

  /* progress dots */
  document.getElementById("progress").innerHTML = STEPS.map((s,i) => {
    let cls = "dot";
    if(s.key.endsWith("-a")) cls += " a";
    if(s.key.endsWith("-b")) cls += " b";
    if(i < state.step) cls += " done";
    if(i === state.step) cls += " cur";
    return `<span class="${cls}"></span>`;
  }).join("");

  /* scene */
  document.getElementById("sceneFrame").innerHTML = sceneSVG(sit.scene, sit, focus);

  /* intro caption — sits above the illustration, only shown on step ① */
  const introCaption = document.getElementById("introCaption");
  if(step.key === "intro"){
    introCaption.hidden = false;
    introCaption.innerHTML = `<p class="tag">무슨 일이 일어났을까요?</p><p class="big">${sit.narration}</p>`;
  } else {
    introCaption.hidden = true;
    introCaption.innerHTML = "";
  }

  /* question */
  document.getElementById("questionBox").innerHTML = step.key === "intro"
    ? ""
    : `<p class="question">${questionText(step, sit)}</p>`;

  /* interactive area */
  const box = document.getElementById("interact");
  const primaryBtn = document.getElementById("primaryBtn");
  const backBtn = document.getElementById("backBtn");
  backBtn.style.visibility = (state.step === 0) ? "hidden" : "visible";

  if(step.key === "intro"){
    box.innerHTML = "";
    primaryBtn.textContent = "다음 →";
  }
  else if(step.key === "ask-a" || step.key === "ask-b" || step.key === "resolve"){
    const person = step.key === "ask-a" ? sit.a : step.key === "ask-b" ? sit.b : null;
    const examples = person ? person.exampleReasons : sit.resolutionExamples;
    const isLastStepOfLastSit = (step.key === "resolve" && state.sit === situations.length - 1);
    box.innerHTML = `
      <div class="examples" id="examplesBox" ${state.revealed ? "" : "hidden"}>
        <div class="examples-label">이렇게 생각한 친구들도 있어요</div>
        <div class="reasons">${examples.map(chip).join("")}</div>
        ${isLastStepOfLastSit ? '<p class="note">35개 상황을 모두 확인했어요! 처음부터 다시 해볼까요?</p>' : ""}
      </div>`;
    primaryBtn.textContent = primaryLabel(step, isLastStepOfLastSit);
  }
  else { /* feel-a / feel-b / result-a / result-b */
    const person = step.key.endsWith("-a") ? sit.a : sit.b;
    const isFeel = step.key.startsWith("feel");
    if(!state.revealed){
      box.innerHTML = `<div class="flipcard" id="flipTarget"><span class="tap-label">👉 눌러서 확인하기</span></div>`;
      primaryBtn.textContent = "";
    } else {
      box.innerHTML = isFeel
        ? `<div class="reveal ${focus}"><span class="icon">${person.emotion.icon}</span><span class="label">${person.emotion.label}</span></div>`
        : `<div class="reveal ${focus}"><span class="text">${person.result}</span></div>`;
      primaryBtn.textContent = "다음 →";
    }
  }

  primaryBtn.style.visibility = primaryBtn.textContent ? "visible" : "hidden";

  /* badge */
  const badgesEl = document.getElementById("badges");
  const badgeHtml = badgesFor(step, sit);
  badgesEl.innerHTML = badgeHtml;
  badgesEl.hidden = !badgeHtml;
}

function goToStep(newSit, newStep, playSituationSfx){
  state.sit = newSit;
  state.step = newStep;
  state.revealed = false;
  render();
  if(playSituationSfx) playSfx(sfxSituation);
  else playSfx(sfxStep);
}

/* ---------- 전체 상황 목록 모달 (35개가 되어도 번호 타일 격자로 표시) ---------- */
function renderSitGrid(){
  const progress = getProgress();
  document.getElementById("modalProgressLabel").textContent =
    `전체 상황 (${Math.min(progress, situations.length)}/${situations.length} 완료)`;
  document.getElementById("sitGrid").innerHTML = situations.map((s, i) => {
    const done = i < progress;
    const active = i === state.sit;
    const cls = ["sit-tile", done ? "done" : "", active ? "active" : ""].filter(Boolean).join(" ");
    return `<button class="${cls}" data-idx="${i}" title="${s.tabLabel}" type="button">${done ? "✓" : i + 1}</button>`;
  }).join("");
}
function openSitModal(){
  renderSitGrid();
  document.getElementById("sitModal").hidden = false;
}
function closeSitModal(){
  document.getElementById("sitModal").hidden = true;
}

document.getElementById("allSitBtn").addEventListener("click", openSitModal);
document.getElementById("closeModalBtn").addEventListener("click", closeSitModal);
document.getElementById("sitModalBackdrop").addEventListener("click", closeSitModal);
document.getElementById("sitGrid").addEventListener("click", (e) => {
  const t = e.target.closest(".sit-tile");
  if(!t) return;
  const idx = Number(t.dataset.idx);
  closeSitModal();
  if(idx === state.sit) return;
  goToStep(idx, 0, true);
});
document.getElementById("prevSitBtn").addEventListener("click", () => {
  goToStep((state.sit - 1 + situations.length) % situations.length, 0, true);
});
document.getElementById("nextSitBtn").addEventListener("click", () => {
  goToStep((state.sit + 1) % situations.length, 0, true);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if(!confirm("지금까지 마친 상황 기록을 모두 초기화할까요?")) return;
  saveProgress(0);
  goToStep(0, 0, true);
});

document.getElementById("backBtn").addEventListener("click", () => {
  if(state.step === 0) return;
  goToStep(state.sit, state.step - 1, false);
});

document.getElementById("interact").addEventListener("click", (e) => {
  if(e.target.closest("#flipTarget")){
    state.revealed = true;
    render();
  }
});

document.getElementById("primaryBtn").addEventListener("click", () => {
  const step = STEPS[state.step];
  const isAsk = step.key === "ask-a" || step.key === "ask-b" || step.key === "resolve";

  if(isAsk && !state.revealed){
    /* reveal examples in place, without rebuilding the textarea (would erase what was typed) */
    state.revealed = true;
    const examplesBox = document.getElementById("examplesBox");
    if(examplesBox) examplesBox.hidden = false;
    const isLastStepOfLastSit = (step.key === "resolve" && state.sit === situations.length - 1);
    const primaryBtn = document.getElementById("primaryBtn");
    primaryBtn.textContent = primaryLabel(step, isLastStepOfLastSit);
    primaryBtn.style.visibility = "visible";
    return;
  }
  if(step.key === "resolve"){
    saveProgress(Math.max(getProgress(), state.sit + 1));
    const isLast = state.sit === situations.length - 1;
    goToStep(isLast ? 0 : state.sit + 1, 0, true);
    return;
  }
  if(state.step < STEPS.length - 1){
    goToStep(state.sit, state.step + 1, false);
  }
});

/* ---------- boot (carry state across republish) ---------- */
function start(initial){
  const resumeAt = Math.min(getProgress(), situations.length - 1);
  state = Object.assign({ sit:resumeAt, step:0, revealed:false }, initial || {});
  render();
}
if(window.claude?.hot){ window.claude.hot.snapshot(() => state); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
